<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>MegaPano + Lupa (demo)</title>
<link rel="stylesheet" href="vendor/psv/index.css">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #111; font-family: system-ui, -apple-system, Segoe UI, sans-serif; }
  #main { position: absolute; inset: 0; touch-action: none; }
  #lens {
    position: absolute; left: 0; top: 0; width: 240px; height: 240px; border-radius: 50%;
    overflow: hidden; pointer-events: none; display: none; z-index: 50;
    box-shadow: 0 0 0 3px rgba(255,255,255,.85), 0 8px 30px rgba(0,0,0,.6), inset 0 0 25px rgba(0,0,0,.45);
    background: #000; will-change: transform;
  }
  #lens-view { position: absolute; inset: 0; }
  #lens::after { /* brillo de vidrio */
    content: ""; position: absolute; inset: 0; border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle at 30% 25%, rgba(255,255,255,.28), rgba(255,255,255,0) 35%);
  }
  #lens.plain { box-shadow: none; }
  #lens.plain::after { display: none; }

  /* Controles de PSV reacomodados en la esquina superior derecha: zoom arriba, flechas + pantalla completa abajo */
  #main .psv-navbar {
    position: absolute !important; top: 12px !important; right: 12px !important; left: auto !important; bottom: auto !important;
    width: auto !important; height: auto !important; transform: none !important; opacity: 1 !important;
    display: grid !important; grid-template-columns: repeat(5, 38px); grid-auto-rows: 38px; gap: 4px; align-items: center; justify-items: center;
    padding: 8px; border-radius: 16px; background: rgba(20,20,24,.72) !important;
    backdrop-filter: blur(6px); box-shadow: 0 4px 18px rgba(0,0,0,.4);
  }
  #main .psv-navbar .psv-button { width: 38px; height: 38px; border-radius: 10px; }
  #main .psv-navbar .psv-button:hover { background: rgba(255,255,255,.14); }
  #main .psv-navbar .psv-zoom-range.psv-button { grid-column: 2 / 5; width: 100%; height: 38px; margin: 0; padding: 0 8px; box-sizing: border-box; display: flex; align-items: center; }
  #main .psv-navbar .psv-zoom-range-line { width: 100%; }
  #main .psv-navbar .psv-button-svg { width: 24px; height: 24px; }
  #main .psv-navbar .psv-menu-button { display: none; }
  #main .psv-navbar > :nth-child(1) { grid-area: 1 / 1; }
  #main .psv-navbar > :nth-child(3) { grid-area: 1 / 5; }
  #main .psv-navbar > :nth-child(4) { grid-area: 2 / 1; } /* izquierda */
  #main .psv-navbar > :nth-child(6) { grid-area: 2 / 2; } /* arriba */
  #main .psv-navbar > :nth-child(7) { grid-area: 2 / 3; } /* abajo */
  #main .psv-navbar > :nth-child(5) { grid-area: 2 / 4; } /* derecha */
  #main .psv-navbar > :nth-child(8) { grid-area: 2 / 5; } /* pantalla completa */
  #stats { display: none; position: absolute; left: 10px; bottom: 10px; z-index: 60; background: rgba(0,0,0,.65); padding: 6px 8px; border-radius: 6px;
    font-family: ui-monospace, monospace; white-space: pre; font-size: 11px; color: #9f9; }
  #stats.debug { display: block; }
  #credit {
    position: absolute; left: 10px; top: 8px; z-index: 55; font-size: 11px; color: rgba(255,255,255,.75);
    text-shadow: 0 1px 3px #000; max-width: 55vw;
  }
  #credit a { color: inherit; }
  @media (max-width: 520px) { #credit { display: none; } }
</style>
</head>
<body>
<div id="main"></div>
<div id="lens"><div id="lens-view"></div></div>

<div id="stats">cargando…</div>
<div id="credit">Foto: <a href="https://commons.wikimedia.org/wiki/File:St_Etheldreda%27s_Church_Interior_360x180,_London,_UK_-_Diliff.jpg" target="_blank" rel="noopener">Diliff / Wikimedia Commons</a>, CC BY-SA 3.0 (reescalada y dividida en tiles)</div>

<script type="importmap">
{ "imports": {
    "three": "./vendor/three/three.module.js",
    "@photo-sphere-viewer/core": "./vendor/psv/index.module.js",
    "@photo-sphere-viewer/equirectangular-tiles-adapter": "./vendor/psv/equirectangular-tiles-adapter.module.js"
} }
</script>
<script type="module" src="app.js"></script>
</body>
</html>
